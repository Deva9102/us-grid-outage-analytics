version: 2

exposures:
  - name: power_bi_outage_dashboard
    label: US power outages and storm impact (Power BI)
    type: dashboard
    maturity: low
    description: >
      The Power BI dashboard I build by hand from these marts, exported by make export (D70):
      the model in powerbi/data_model.md, the measures in powerbi/measures.md, the layout in
      powerbi/dashboard_plan.md. Six pages, one question each: (1) US overview: how much power
      was lost in the year and was it worse than the year before; (2) state and county map: which
      places lose the most outage hours per 1,000 customers, with footnotes; (3) storms and
      restoration: which storms cause the most outage time and how long each takes to restore;
      (4) event drill-down: where, when, how big and which storm for one event; (5) utility
      reliability benchmark: Eversource and National Grid SAIDI / SAIFI against same-size peers;
      (6) data quality and coverage: coverage per year, footnotes, the D61 restatement. Years are
      event start years.
    owner:
      name: Deva9102
    depends_on:
      - ref('fct_outage_events')
      - ref('fct_state_reliability')
      - ref('fct_county_reliability')
      - ref('fct_territory_reliability')
      - ref('fct_utility_reliability')
      - ref('dim_county')
      - ref('dim_state')
      - ref('dim_date')
      - ref('dim_year')
      - ref('dim_storm_type')
      - ref('dim_utility')
      - ref('fct_county_coverage')
      - ref('fct_published_coverage')
      - ref('fct_data_quality_index')
