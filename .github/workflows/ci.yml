name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: ruff
        run: uv run ruff check scripts tests

      - name: sqlfluff
        run: uv run sqlfluff lint --ignore-local-config --config .sqlfluff sql/databricks

      - name: pytest (fast suite on tests/fixtures)
        run: uv run pytest -q

      # dbt has its own environment (dbt/pyproject.toml, D66); the fixture build needs no secrets.
      - name: dbt parse and build on the fixture (DuckDB)
        run: |
          uv run python scripts/build_duckdb.py
          cd dbt
          uv sync --locked
          uv run python run_dbt.py parse --target duckdb
          uv run python run_dbt.py build --target duckdb
          cd ..
          uv run python scripts/reconcile_marts.py --engine duckdb
